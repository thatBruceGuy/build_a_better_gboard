# Build an installable APK and attach it to the workflow run.
#
# Why this exists: building FUTO Keyboard needs an Android SDK, NDK 28.2, and
# network access to gitlab.futo.org and huggingface.co, where six of the seven
# submodules live. A machine without all of those cannot build this repo at all.
# A GitHub runner has all of them, so the build happens there and the APK comes
# back as a downloadable artifact.
#
# No secrets are required. The debug signing config uses java/shared.keystore,
# which is committed, so the APK is signed well enough for a phone to install it.
# It is NOT suitable for distribution -- everyone building this repo shares that
# key.
#
# Run it: Actions tab -> "Build APK" -> "Run workflow".
# Then open the finished run and download the "keyboard-apk" artifact.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle variant to assemble"
        type: choice
        default: assembleUnstableDebug
        options:
          - assembleUnstableDebug
          - assembleStableDebug
  push:
    branches:
      - "claude/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          # Not optional. Seven submodules carry the layouts, dictionaries,
          # translations, themes and native libs; the build fails without them.
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Fetch submodule LFS objects
        # The futo-swipe submodule is a Hugging Face model repo, so its payload
        # is LFS-backed. actions/checkout's own lfs flag covers only the parent
        # repo, not submodules.
        run: git submodule foreach --recursive 'git lfs pull || true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK this project pins
        # build.gradle pins ndkVersion '28.2.13676358'. Runner images ship a
        # different NDK, and Gradle will not silently substitute one.
        run: sdkmanager --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"

      - name: Derive version strings
        # build.gradle reads these from the environment and falls back to
        # `git describe` / `git rev-list` otherwise. This repo is rooted at a
        # single import commit with no tags, so the fallback would fail.
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VERSION_NAME=compact-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Assemble
        run: ./gradlew --no-daemon ${{ inputs.variant || 'assembleUnstableDebug' }}

      - name: Show what was produced
        if: always()
        run: find build/outputs -name '*.apk' -printf '%p  %kKB\n' || true

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-apk
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
